name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repo.
permissions:
  contents: read

# A second push to a PR makes the first run pointless. `main` is exempt so every
# commit that lands keeps a result of its own.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Four independent jobs on four runners, so the wall clock is the slowest suite rather than the
# sum of all of them — and a formatting slip doesn't hide whether the tests would have passed.
# Branch protection requires only "CI green", which fails unless every job before it succeeded;
# jobs can be added or renamed without touching the protection rule.
jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      # Restores the Gradle cache and checks gradle-wrapper.jar against the published
      # checksums — worth having, since that jar is committed to the repo.
      - uses: gradle/actions/setup-gradle@v6

      - name: Check formatting
        run: ./gradlew spotlessCheck

  engine:
    name: Engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6

      # The engine is where the app is proven correct — spec §10.
      - name: Test engine
        run: ./gradlew :engine:test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: engine-test-reports
          path: engine/build/reports/tests/
          retention-days: 7

  server:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6

      # Runs real Postgres through Testcontainers, so it needs a Docker daemon. ubuntu-latest
      # ships one; a self-hosted or macOS runner would not, and this step is where you would
      # find that out.
      - name: Test server
        run: ./gradlew :server:test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-test-reports
          path: server/build/reports/tests/
          retention-days: 7

  # `web` is a plain npm project, not a Gradle module, so it has its own job and toolchain. That
  # is a deliberate trade: `./gradlew check` stays JVM-only and fast, and §10's documented npm
  # commands are the real ones rather than a second way of doing it.
  web:
    name: Web tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Lint web
        run: npm --prefix web run lint

      - name: Test web
        run: npm --prefix web test

      # Typechecks as well as bundles — vue-tsc runs as part of the build script, so a type error
      # fails here rather than at deploy time.
      - name: Build web
        run: npm --prefix web run build

  # The whole product in one piece: Playwright drives the built screens against the seeded
  # backend — Gradle boots Postgres through Testcontainers, Vite serves the app, and the tests
  # walk the money flows a mocked API cannot vouch for. Needs both toolchains and Docker.
  e2e:
    name: Web e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Install Playwright browser
        run: npm --prefix web exec playwright install --with-deps chromium

      - name: Run e2e suite
        run: npm --prefix web run e2e

      - name: Upload e2e report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  green:
    name: CI green
    if: always()
    needs: [format, engine, server, web, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for result in $results; do
            [ "$result" = 'success' ] || exit 1
          done
