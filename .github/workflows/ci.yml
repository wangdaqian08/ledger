name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repo.
permissions:
  contents: read

# A second push to a PR makes the first run pointless. `main` is exempt so every
# commit that lands keeps a result of its own.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      # Restores the Gradle cache and checks gradle-wrapper.jar against the published
      # checksums — worth having, since that jar is committed to the repo.
      - uses: gradle/actions/setup-gradle@v6

      # Formatting first: it fails in seconds and needs no compilation.
      - name: Check formatting
        run: ./gradlew spotlessCheck

      # The engine is where the app is proven correct — spec §10.
      - name: Test engine
        run: ./gradlew :engine:test

      # Runs real Postgres through Testcontainers, so it needs a Docker daemon. ubuntu-latest
      # ships one; a self-hosted or macOS runner would not, and this step is where you would
      # find that out.
      - name: Test server
        run: ./gradlew :server:test

      # `web` is a plain npm project, not a Gradle module, so it needs its own steps. That is a
      # deliberate trade: `./gradlew check` stays JVM-only and fast, and §10's documented npm
      # commands are the real ones rather than a second way of doing it.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Lint web
        run: npm --prefix web run lint

      - name: Test web
        run: npm --prefix web test

      # Typechecks as well as bundles — vue-tsc runs as part of the build script, so a type error
      # fails here rather than at deploy time.
      - name: Build web
        run: npm --prefix web run build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            engine/build/reports/tests/
            server/build/reports/tests/
          retention-days: 7
