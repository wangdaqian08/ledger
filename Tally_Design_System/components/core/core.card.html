<!-- @dsCard group="Components" viewport="700x380" name="Core" subtitle="Buttons, cards, chips, avatars, amounts, badges" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:14px;background:var(--paper)}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.col{display:flex;flex-direction:column;gap:12px}.lbl{font:800 11px/1 var(--font-core);letter-spacing:.06em;text-transform:uppercase;color:var(--text-subtle)}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Card, Chip, Badge, Avatar, AvatarStack, Amount, Icon } = window.TallyDesignSystem_ae2e12;
const P=[{name:'Mei Wong',hue:4},{name:'Sam Oyelaran',hue:2},{name:'Ade Kim',hue:6},{name:'Jo Park',hue:8},{name:'Tom Lin',hue:5}];
function Demo(){
  const [cat,setCat]=React.useState('food');
  return <div className="col">
    <div className="row"><Button icon="plus">Add expense</Button><Button variant="solid" tone="mint" icon="check">Settle up</Button><Button variant="outline">Cancel</Button><Button variant="soft">Split evenly</Button><Button variant="ghost">Skip</Button><Button disabled>Disabled</Button></div>
    <div className="row"><Button size="sm">Small</Button><Button size="md">Medium</Button><Button size="lg" tone="lemon" variant="solid">Large</Button><IconButton name="arrow-left" variant="plain"/><IconButton name="user-plus" variant="surface"/><IconButton name="share-2" variant="tint"/><IconButton name="plus" variant="solid" tone="action"/></div>
    <div className="row"><Chip icon="utensils" selected={cat==='food'} onClick={()=>setCat('food')}>Food</Chip><Chip icon="car-front" selected={cat==='transport'} onClick={()=>setCat('transport')}>Transport</Chip><Chip icon="bed-double" selected={cat==='stay'} onClick={()=>setCat('stay')}>Stay</Chip><Badge tone="mint">Settled</Badge><Badge tone="coral">You owe</Badge><Badge tone="lemon">New</Badge><Badge>3 left</Badge></div>
    <div className="row"><Avatar name="Mei Wong" hue={4}/><Avatar name="Sam Oyelaran" hue={2} selected/><Avatar name="Ade Kim" hue={6} dimmed/><Avatar name="Jo Park" hue={8} badge="2×"/><AvatarStack people={P} size={34}/></div>
    <div className="row" style={{gap:20}}><Amount value={1284.5} size="lg"/><Amount value={-24} tone="owe" showSign/><Amount value={12.5} tone="owed" showSign/><Amount value={0} tone="settled" size="sm"/></div>
    <div className="row" style={{alignItems:'stretch'}}><Card lift={4} style={{flex:1}}><div className="lbl">Surface</div><Amount value={84.2} size="lg"/></Card><Card tone="mint" lift={4} style={{flex:1}}><div className="lbl">Mint</div><Amount value={42.5} tone="owed" size="lg"/></Card><Card tone="coral" lift={4} style={{flex:1}}><div className="lbl">Coral</div><Amount value={18.4} tone="owe" size="lg"/></Card><Card tone="ink" lift={0} style={{flex:1}}><div className="lbl" style={{color:'var(--ink-4)'}}>Ink</div><Amount value={310} tone="onDark" size="lg"/></Card></div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
