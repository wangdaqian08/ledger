<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:14px;background:var(--paper)}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.col{display:flex;flex-direction:column;gap:12px}.lbl{font:800 11px/1 var(--font-core);letter-spacing:.06em;text-transform:uppercase;color:var(--text-subtle)}</style></head><body><div id="root"></div>
<script type="text/babel">
const { AppBar, TabBar, Sheet, IconButton, Button, Input } = window.TallyDesignSystem_ae2e12;
const TABS=[{id:'groups',label:'Groups',icon:'users'},{id:'activity',label:'Activity',icon:'clock'},{id:'friends',label:'Friends',icon:'user-round'},{id:'you',label:'You',icon:'circle-user'}];
function Demo(){
  const [tab,setTab]=React.useState('groups');
  const [open,setOpen]=React.useState(true);
  return <div style={{display:'grid',gridTemplateColumns:'1fr 320px',gap:16,alignItems:'start'}}>
    <div className="col">
      <div style={{border:'2px solid var(--ink)',borderRadius:'var(--radius-card)',overflow:'hidden'}}>
        <AppBar title="Osaka trip" subtitle="4 people · you owe $42.80" onBack={()=>{}} actions={<IconButton name="user-plus" size={40} label="Invite"/>}/>
        <div style={{height:26,background:'var(--paper)'}}></div>
      </div>
      <div style={{border:'2px solid var(--ink)',borderRadius:'var(--radius-card)',overflow:'hidden'}}>
        <AppBar tone="ink" title="Settle up" onBack={()=>{}} actions={<IconButton name="x" size={40} label="Close" style={{color:'#fff'}}/>}/>
        <div style={{height:26,background:'var(--paper)'}}></div>
      </div>
      <div style={{border:'2px solid var(--ink)',borderRadius:'var(--radius-card)',overflow:'hidden',paddingTop:22}}>
        <TabBar tabs={TABS} value={tab} onChange={setTab} centerAction={{icon:'plus',label:'Add expense'}}/>
      </div>
    </div>
    <div style={{position:'relative',height:300,border:'2px solid var(--ink)',borderRadius:'var(--radius-card)',overflow:'hidden',background:'var(--bg-sunk)'}}>
      <Sheet open={open} onClose={()=>setOpen(true)} title="New group" footer={<Button block size="lg">Create group</Button>}>
        <div className="col"><Input label="Group name" icon="users" placeholder="Osaka trip"/><Input label="Invite by email" icon="mail" placeholder="sam@example.com"/></div>
      </Sheet>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
