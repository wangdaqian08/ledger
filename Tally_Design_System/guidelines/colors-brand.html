<!-- @dsCard group="Colors" viewport="700x150" name="Brand" subtitle="Grape is the only action colour; Lemon is the accent" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--paper);font-family:var(--font-core)}.grid{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:104px;padding:8px;border:2px solid var(--ink);border-radius:var(--radius-md)}.n{font:800 12px/1.2 var(--font-core)}.h{font:500 11px/1.2 var(--font-money);opacity:.75;margin-top:2px}.lbl{font:800 11px/1 var(--font-core);letter-spacing:.06em;text-transform:uppercase;color:var(--text-subtle)}</style></head><body><div class="grid">
<div class="sw" style="background:#4B3BFF;color:#fff"><div class="n">Grape</div><div class="h">--grape / --action</div></div>
<div class="sw" style="background:#3A2CD6;color:#fff"><div class="n">Grape press</div><div class="h">--grape-press</div></div>
<div class="sw" style="background:#EDEBFF;color:var(--ink)"><div class="n">Grape tint</div><div class="h">--grape-tint</div></div>
<div class="sw" style="background:#FFCE2E;color:var(--ink)"><div class="n">Lemon</div><div class="h">--lemon</div></div>
<div class="sw" style="background:#E8B517;color:var(--ink)"><div class="n">Lemon press</div><div class="h">--lemon-press</div></div>
<div class="sw" style="background:#FFF6DC;color:var(--ink)"><div class="n">Lemon tint</div><div class="h">--lemon-tint</div></div>
</div></body></html>
