<!-- @dsCard group="Colors" viewport="700x150" name="Money semantics" subtitle="Mint = owed to you · Coral = you owe · Grey = settled" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--paper);font-family:var(--font-core)}.grid{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:104px;padding:8px;border:2px solid var(--ink);border-radius:var(--radius-md)}.n{font:800 12px/1.2 var(--font-core)}.h{font:500 11px/1.2 var(--font-money);opacity:.75;margin-top:2px}.lbl{font:800 11px/1 var(--font-core);letter-spacing:.06em;text-transform:uppercase;color:var(--text-subtle)}</style></head><body><div class="grid">
<div class="sw" style="background:#00BF87;color:#fff"><div class="n">Mint</div><div class="h">--mint / --owed-to-you</div></div>
<div class="sw" style="background:#00A374;color:#fff"><div class="n">Mint press</div><div class="h">--mint-press</div></div>
<div class="sw" style="background:#DCF7EF;color:var(--ink)"><div class="n">Mint tint</div><div class="h">--mint-tint</div></div>
<div class="sw" style="background:#FF5147;color:#fff"><div class="n">Coral</div><div class="h">--coral / --you-owe</div></div>
<div class="sw" style="background:#E23A31;color:#fff"><div class="n">Coral press</div><div class="h">--coral-press</div></div>
<div class="sw" style="background:#FFE6E4;color:var(--ink)"><div class="n">Coral tint</div><div class="h">--you-owe-tint</div></div>
<div class="sw" style="background:#7C7689;color:#fff"><div class="n">Settled</div><div class="h">--settled</div></div>
</div></body></html>
