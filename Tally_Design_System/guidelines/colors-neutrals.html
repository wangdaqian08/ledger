<!-- @dsCard group="Colors" viewport="700x150" name="Paper & ink" subtitle="Warm paper base, soft ink ramp, hairlines" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--paper);font-family:var(--font-core)}.grid{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:104px;padding:8px;border:2px solid var(--ink);border-radius:var(--radius-md)}.n{font:800 12px/1.2 var(--font-core)}.h{font:500 11px/1.2 var(--font-money);opacity:.75;margin-top:2px}.lbl{font:800 11px/1 var(--font-core);letter-spacing:.06em;text-transform:uppercase;color:var(--text-subtle)}</style></head><body><div class="grid">
<div class="sw" style="background:#FFFBF2;color:var(--ink)"><div class="n">Paper</div><div class="h">--paper / --bg-app</div></div>
<div class="sw" style="background:#F6F0E4;color:var(--ink)"><div class="n">Paper sunk</div><div class="h">--paper-sunk</div></div>
<div class="sw" style="background:#FFFFFF;color:var(--ink)"><div class="n">Surface</div><div class="h">--surface-card</div></div>
<div class="sw" style="background:#E7E0D3;color:var(--ink)"><div class="n">Hairline</div><div class="h">--hairline</div></div>
<div class="sw" style="background:#ABA5B6;color:var(--ink)"><div class="n">Ink 4</div><div class="h">--ink-4</div></div>
<div class="sw" style="background:#7C7689;color:#fff"><div class="n">Ink 3</div><div class="h">--text-muted</div></div>
<div class="sw" style="background:#4B4655;color:#fff"><div class="n">Ink 2</div><div class="h">--ink-2</div></div>
<div class="sw" style="background:#1A1720;color:#fff"><div class="n">Ink</div><div class="h">--ink / --text-body</div></div>
</div></body></html>
