<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--paper);font-family:var(--font-core)}.grid{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:104px;padding:8px;border:2px solid var(--ink);border-radius:var(--radius-md)}.n{font:800 12px/1.2 var(--font-core)}.h{font:500 11px/1.2 var(--font-money);opacity:.75;margin-top:2px}.lbl{font:800 11px/1 var(--font-core);letter-spacing:.06em;text-transform:uppercase;color:var(--text-subtle)}.p{width:56px;height:56px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font:800 18px var(--font-core);color:#fff}</style></head><body>
<div class="grid" style="align-items:center;gap:12px">
<div class="p" style="background:var(--person-1)">1</div>
<div class="p" style="background:var(--person-2)">2</div>
<div class="p" style="background:var(--person-3);color:var(--ink)">3</div>
<div class="p" style="background:var(--person-4)">4</div>
<div class="p" style="background:var(--person-5)">5</div>
<div class="p" style="background:var(--person-6)">6</div>
<div class="p" style="background:var(--person-7)">7</div>
<div class="p" style="background:var(--person-8)">8</div>
</div>
<div class="h" style="margin-top:14px;font-family:var(--font-money)">--person-1 … --person-8 · round-robin by join order · hue 3 (lemon) takes ink text, all others take white</div>
</body></html>
