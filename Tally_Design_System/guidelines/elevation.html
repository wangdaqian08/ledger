<!-- @dsCard group="Brand" viewport="700x200" name="Slab elevation" subtitle="Hard ink edges, never blurry grey shadows" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--paper);font-family:var(--font-core)}.grid{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:104px;padding:8px;border:2px solid var(--ink);border-radius:var(--radius-md)}.n{font:800 12px/1.2 var(--font-core)}.h{font:500 11px/1.2 var(--font-money);opacity:.75;margin-top:2px}.lbl{font:800 11px/1 var(--font-core);letter-spacing:.06em;text-transform:uppercase;color:var(--text-subtle)}.s{flex:1;height:78px;background:var(--surface-card);border:2px solid var(--ink);border-radius:var(--radius-card);display:flex;align-items:center;justify-content:center;font:800 12px var(--font-money);color:var(--ink-2)}</style></head><body>
<div style="display:flex;gap:16px;align-items:flex-start">
<div style="flex:1;text-align:center"><div class="s">flat</div><div class="lbl" style="margin-top:8px">lift 0</div></div>
<div style="flex:1;text-align:center"><div class="s" style="box-shadow:0 2px 0 0 var(--ink)">2px</div><div class="lbl" style="margin-top:8px">--slab-1</div></div>
<div style="flex:1;text-align:center"><div class="s" style="box-shadow:0 4px 0 0 var(--ink)">4px</div><div class="lbl" style="margin-top:8px">--slab-2</div></div>
<div style="flex:1;text-align:center"><div class="s" style="box-shadow:0 6px 0 0 var(--ink)">6px</div><div class="lbl" style="margin-top:8px">--slab-3</div></div>
<div style="flex:1;text-align:center"><div class="s" style="background:var(--grape);color:#fff;box-shadow:0 4px 0 0 var(--grape-press);border-color:transparent">coloured</div><div class="lbl" style="margin-top:8px">--slab-action</div></div>
</div></body></html>
