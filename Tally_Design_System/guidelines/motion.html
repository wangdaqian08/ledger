<!-- @dsCard group="Brand" viewport="700x210" name="Motion" subtitle="One spring curve, four durations, everything overshoots" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--paper);font-family:var(--font-core)}.grid{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:104px;padding:8px;border:2px solid var(--ink);border-radius:var(--radius-md)}.n{font:800 12px/1.2 var(--font-core)}.h{font:500 11px/1.2 var(--font-money);opacity:.75;margin-top:2px}.lbl{font:800 11px/1 var(--font-core);letter-spacing:.06em;text-transform:uppercase;color:var(--text-subtle)}.t{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-2)}.k{font-family:var(--font-money);font-weight:700;color:var(--ink);min-width:74px}.dot{width:14px;height:14px;border-radius:50%;background:var(--grape);border:2px solid var(--ink);animation:sl 1.6s var(--ease-spring) infinite alternate}@keyframes sl{to{transform:translateX(140px)}}</style></head><body>
<div style="display:flex;flex-direction:column;gap:9px">
<div class="t"><span class="k">90ms</span> --dur-instant · press feedback</div>
<div class="t"><span class="k">160ms</span> --dur-fast · chips, toggles, avatars</div>
<div class="t"><span class="k">240ms</span> --dur-base · cards, list reflow, toasts</div>
<div class="t"><span class="k">380ms</span> --dur-slow · sheets, screen transitions</div>
<div class="t"><span class="k">620ms</span> --dur-celebrate · the all-square moment</div>
<div class="t" style="margin-top:6px"><span class="k">spring</span><span class="dot"></span><span style="font-family:var(--font-money);font-size:12px">cubic-bezier(.34, 1.56, .64, 1)</span></div>
</div></body></html>
