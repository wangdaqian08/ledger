<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--paper);font-family:var(--font-core)}.grid{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:104px;padding:8px;border:2px solid var(--ink);border-radius:var(--radius-md)}.n{font:800 12px/1.2 var(--font-core)}.h{font:500 11px/1.2 var(--font-money);opacity:.75;margin-top:2px}.lbl{font:800 11px/1 var(--font-core);letter-spacing:.06em;text-transform:uppercase;color:var(--text-subtle)}.btn{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 22px;border:2px solid var(--ink);border-radius:999px;background:var(--grape);color:#fff;font:800 16px var(--font-core)}</style></head><body>
<div style="display:flex;gap:40px;align-items:flex-start">
<div style="text-align:center"><div class="btn" style="box-shadow:0 4px 0 0 var(--ink)">Add expense</div><div class="lbl" style="margin-top:14px">rest</div></div>
<div style="text-align:center"><div class="btn" style="box-shadow:0 1px 0 0 var(--ink);transform:translateY(3px)">Add expense</div><div class="lbl" style="margin-top:14px">pressed</div></div>
<div style="text-align:center"><div class="btn" style="opacity:.42;box-shadow:0 4px 0 0 var(--ink)">Add expense</div><div class="lbl" style="margin-top:14px">disabled 42%</div></div>
</div>
<div class="h" style="margin-top:18px;font-family:var(--font-money)">transition 90ms --ease-out on transform + box-shadow. No hover styling is designed — this is a touch product.</div>
</body></html>
