<!-- @dsCard group="Spacing" viewport="700x200" name="Semantic spacing" subtitle="Screen gutter, card padding, tap minimum" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--paper);font-family:var(--font-core)}.grid{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:104px;padding:8px;border:2px solid var(--ink);border-radius:var(--radius-md)}.n{font:800 12px/1.2 var(--font-core)}.h{font:500 11px/1.2 var(--font-money);opacity:.75;margin-top:2px}.lbl{font:800 11px/1 var(--font-core);letter-spacing:.06em;text-transform:uppercase;color:var(--text-subtle)}</style></head><body>
<div style="display:flex;flex-direction:column;gap:9px;font-size:14px;color:var(--ink-2)">
<div><b style="font-family:var(--font-money)">16px</b> &nbsp;<code style="font-family:var(--font-money);color:var(--action)">--gutter-screen</code> &nbsp;left/right page margin</div>
<div><b style="font-family:var(--font-money)">16px</b> &nbsp;<code style="font-family:var(--font-money);color:var(--action)">--pad-card</code> &nbsp;inside a Card</div>
<div><b style="font-family:var(--font-money)">10px</b> &nbsp;<code style="font-family:var(--font-money);color:var(--action)">--gap-list</code> &nbsp;between stacked cards</div>
<div><b style="font-family:var(--font-money)">28px</b> &nbsp;<code style="font-family:var(--font-money);color:var(--action)">--stack-section</code> &nbsp;between screen sections</div>
<div><b style="font-family:var(--font-money)">48px</b> &nbsp;<code style="font-family:var(--font-money);color:var(--action)">--tap-min</code> &nbsp;minimum hit target — never smaller</div>
<div><b style="font-family:var(--font-money)">56 / 64px</b> &nbsp;<code style="font-family:var(--font-money);color:var(--action)">--appbar-h / --tabbar-h</code></div>
</div></body></html>
