<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--paper);font-family:var(--font-core)}.grid{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:104px;padding:8px;border:2px solid var(--ink);border-radius:var(--radius-md)}.n{font:800 12px/1.2 var(--font-core)}.h{font:500 11px/1.2 var(--font-money);opacity:.75;margin-top:2px}.lbl{font:800 11px/1 var(--font-core);letter-spacing:.06em;text-transform:uppercase;color:var(--text-subtle)}.c{flex:1;padding:16px;border:2px solid var(--ink);border-radius:var(--radius-card);box-shadow:0 4px 0 0 var(--ink)}.m{font-family:var(--font-money);font-weight:700;font-size:26px;line-height:1}</style></head><body>
<div style="display:flex;gap:12px">
<div class="c" style="background:var(--surface-card)"><div class="lbl">surface</div><div class="m" style="margin-top:8px">$84.20</div></div>
<div class="c" style="background:var(--bg-sunk)"><div class="lbl">sunk</div><div class="m" style="margin-top:8px">$84.20</div></div>
<div class="c" style="background:var(--mint-tint)"><div class="lbl">mint</div><div class="m" style="margin-top:8px;color:var(--mint-press)">+$42.50</div></div>
<div class="c" style="background:var(--you-owe-tint)"><div class="lbl">coral</div><div class="m" style="margin-top:8px;color:var(--coral-press)">−$18.40</div></div>
<div class="c" style="background:var(--lemon-tint)"><div class="lbl">lemon</div><div class="m" style="margin-top:8px">$84.20</div></div>
<div class="c" style="background:var(--ink);box-shadow:none"><div class="lbl">ink</div><div class="m" style="margin-top:8px;color:#fff">$84.20</div></div>
</div></body></html>
