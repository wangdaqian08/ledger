<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--paper);font-family:var(--font-core)}.grid{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:104px;padding:8px;border:2px solid var(--ink);border-radius:var(--radius-md)}.n{font:800 12px/1.2 var(--font-core)}.h{font:500 11px/1.2 var(--font-money);opacity:.75;margin-top:2px}.lbl{font:800 11px/1 var(--font-core);letter-spacing:.06em;text-transform:uppercase;color:var(--text-subtle)}.p{padding:12px 14px;border:2px solid var(--ink);border-radius:var(--radius-md);font-size:15px}.y{background:var(--mint-tint)}.n{background:var(--you-owe-tint)}</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<div class="p y"><div class="lbl" style="color:var(--mint-press)">Say</div><div style="margin-top:5px;font-weight:700">You're all square</div></div>
<div class="p n"><div class="lbl" style="color:var(--coral-press)">Not</div><div style="margin-top:5px;font-weight:700">Balance reconciled: $0.00</div></div>
<div class="p y"><div class="lbl" style="color:var(--mint-press)">Say</div><div style="margin-top:5px;font-weight:700">Mei paid · Yesterday</div></div>
<div class="p n"><div class="lbl" style="color:var(--coral-press)">Not</div><div style="margin-top:5px;font-weight:700">Transaction initiated by M. Wong</div></div>
<div class="p y"><div class="lbl" style="color:var(--mint-press)">Say</div><div style="margin-top:5px;font-weight:700">Nudge Sam</div></div>
<div class="p n"><div class="lbl" style="color:var(--coral-press)">Not</div><div style="margin-top:5px;font-weight:700">Send payment reminder notification</div></div>
</div></body></html>
