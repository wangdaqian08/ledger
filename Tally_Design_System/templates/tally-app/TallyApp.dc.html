<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Tally app screen" description="Mobile web screen in the Tally split-bill style: app bar, balance card, group tiles, tab bar." -->
<helmet><script src="./ds-base.js"></script><style>@media print{body{background:#fff}}</style></helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#F6F0E4;font-family:'Figtree',system-ui,sans-serif">
<div style="width:390px;height:740px;display:flex;flex-direction:column;background:#FFFBF2;border:2.5px solid #1A1720;border-radius:38px;box-shadow:0 8px 0 0 #1A1720;overflow:hidden;position:relative">
<div style="flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 24px 6px;font-family:'Space Grotesk',monospace;font-weight:700;font-size:13px;color:#1A1720"><span>9:41</span><span>tally.app</span></div>
<div style="flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:8px 16px 12px;border-bottom:1.5px solid #E7E0D3">
<div><div style="font-size:24px;font-weight:800;letter-spacing:-0.02em;line-height:1.1;color:#1A1720">Tally</div><div style="font-size:13px;color:#7C7689;margin-top:1px">Split it, sorted</div></div>
<x-import component-from-global-scope="TallyDesignSystem_ae2e12.IconButton" name="search" size="42" label="Search" hint-size="42px,42px"></x-import>
</div>
<div style="flex:1;min-height:0;overflow-y:auto;padding:16px 16px 32px;display:flex;flex-direction:column;gap:28px">
<div style="background:#FFE6E4;border:2px solid #1A1720;border-radius:20px;padding:16px;box-shadow:0 6px 0 0 #1A1720">
<div style="font-size:12px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:#ABA5B6">Overall you owe</div>
<div style="margin-top:6px;font-family:'Space Grotesk',monospace;font-variant-numeric:tabular-nums;font-size:48px;font-weight:700;letter-spacing:-0.03em;line-height:1;color:#FF5147">$24.05</div>
</div>
<div style="display:flex;flex-direction:column;gap:10px">
<div style="font-size:12px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:#ABA5B6">Your groups</div>
<x-import component-from-global-scope="TallyDesignSystem_ae2e12.GroupCard" name="Osaka trip" icon="plane" hue="{{ five }}" members="{{ members }}" balance="{{ negBalance }}" hint-size="100%,150px"></x-import>
<x-import component-from-global-scope="TallyDesignSystem_ae2e12.GroupCard" name="Flat 12B" icon="house" hue="{{ six }}" members="{{ members }}" balance="{{ zero }}" hint-size="100%,150px"></x-import>
</div>
</div>
<x-import component-from-global-scope="TallyDesignSystem_ae2e12.TabBar" tabs="{{ tabs }}" value="groups" centerAction="{{ centerAction }}" hint-size="100%,64px"></x-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      five: 5, six: 6, zero: 0, negBalance: -42.8,
      members: [
        { name: 'You', hue: 6 },
        { name: 'Mei Wong', hue: 4 },
        { name: 'Sam Oyelaran', hue: 2 },
        { name: 'Ade Kim', hue: 5 },
      ],
      tabs: [
        { id: 'groups', label: 'Groups', icon: 'users' },
        { id: 'activity', label: 'Activity', icon: 'clock' },
        { id: 'friends', label: 'Friends', icon: 'user-round' },
        { id: 'you', label: 'You', icon: 'circle-user' },
      ],
      centerAction: { icon: 'plus', label: 'Add expense' },
    };
  }
}
</script>
</body>
</html>
