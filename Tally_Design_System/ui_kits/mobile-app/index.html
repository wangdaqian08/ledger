<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tally — mobile app</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="./data.js"></script>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg-sunk)}
.phone{width:390px;height:740px;display:flex;flex-direction:column;background:var(--paper);border:2.5px solid var(--ink);border-radius:38px;box-shadow:0 8px 0 0 var(--ink);overflow:hidden;position:relative}
.status{display:flex;align-items:center;justify-content:space-between;padding:10px 22px 4px;font:700 13px/1 var(--font-money);color:var(--ink);flex:0 0 auto}
.status .r{display:flex;gap:5px;align-items:center}
.bar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 14px 10px;border-bottom:1.5px solid var(--border-soft)}
.url{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:34px;background:var(--bg-sunk);border-radius:999px;font:600 13px/1 var(--font-core);color:var(--ink-2)}
.app{flex:1;min-height:0;position:relative}
.ind{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:130px;height:5px;border-radius:999px;background:var(--ink);opacity:.85;z-index:99}
.status svg,.bar svg{display:block}
</style></head><body>
<div class="phone">
  <div class="status"><span>9:41</span><span class="r"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01"></path><path d="M7 20v-4"></path><path d="M12 20v-8"></path><path d="M17 20V8"></path><path d="M22 4v16"></path></svg><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"></path><path d="M2 8.82a15 15 0 0 1 20 0"></path><path d="M5 12.859a10 10 0 0 1 14 0"></path><path d="M8.5 16.429a5 5 0 0 1 7 0"></path></svg><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 10v4"></path><path d="M14 10v4"></path><path d="M22 14v-4"></path><path d="M6 10v4"></path><rect x="2" y="6" width="16" height="12" rx="2"></rect></svg></span></div>
  <div class="bar"><span style="opacity:.35;display:flex"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></span><div class="url"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>tally.app</div><span style="opacity:.35;display:flex"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg></span></div>
  <div class="app" id="root"></div>
  <div class="ind"></div>
</div>
<script type="text/babel" src="./Screens.jsx"></script>
<script type="text/babel" src="./App.jsx"></script>
<script type="text/babel">
  const mount = () => {
    if (!window.TallyApp) return setTimeout(mount, 40);
    ReactDOM.createRoot(document.getElementById('root')).render(<TallyApp />);
  };
  mount();
</script>
</body></html>
