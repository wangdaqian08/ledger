<!-- @dsCard group="Mobile App" viewport="1300x1990" name="All screens" subtitle="Every Tally screen side by side, including both sub-screens" -->
<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tally — all screens</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="./data.js"></script>
<style>
body{margin:0;padding:16px;background:var(--bg-sunk);font-family:var(--font-core);overflow:hidden}
.wrap{display:grid;grid-template-columns:repeat(3,390px);gap:30px 26px;align-items:start;justify-content:center;transform-origin:top center}
.item{flex:0 0 auto;display:flex;flex-direction:column;gap:10px}
.cap{display:flex;flex-direction:column;gap:2px;max-width:390px}
.cap b{font:800 17px/1.2 var(--font-core);letter-spacing:-.012em;color:var(--ink)}
.cap span{font-size:13px;color:var(--text-muted)}
.frame{width:390px;height:812px;display:flex;flex-direction:column;background:var(--paper);border:2.5px solid var(--ink);border-radius:38px;box-shadow:0 8px 0 0 var(--ink);overflow:hidden;position:relative}
.status{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 24px 6px;font-family:var(--font-money);font-weight:700;font-size:13px;color:var(--ink)}
.status svg{display:block}
.stack{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
</style></head><body>
<div class="wrap" id="root"></div>
<script type="text/babel" src="./Screens.jsx"></script>
<script type="text/babel">
const D = window.TallyDesignSystem_ae2e12;
const { AppBar, TabBar, IconButton, Icon } = D;
const TABS = [
  { id: 'groups', label: 'Groups', icon: 'users' },
  { id: 'activity', label: 'Activity', icon: 'clock' },
  { id: 'friends', label: 'Friends', icon: 'user-round' },
  { id: 'you', label: 'You', icon: 'circle-user' },
];

function Frame({ label, note, bar, children }) {
  return (
    <div className="item">
      <div className="cap"><b>{label}</b><span>{note}</span></div>
      <div className="frame">
        <div className="status">
          <span>9:41</span>
          <span style={{ display: 'flex', gap: 5, alignItems: 'center' }}>
            <Icon name="signal" size={14} /><Icon name="wifi" size={14} /><Icon name="battery-full" size={14} />
          </span>
        </div>
        <div className="stack">{bar}{children}<TabBar tabs={TABS} value="groups" centerAction={{ icon: 'plus', label: 'Add expense' }} /></div>
      </div>
    </div>
  );
}

function Gallery() {
  const { GROUPS, MEMBERS } = window.TallyData;
  const osaka = GROUPS[0];
  const expense = osaka.expenses[0];
  const noop = () => {};
  return (
    <>
      <Frame label="Groups home" note="The starting point — tap the balance card or a group tile."
        bar={<AppBar title="Tally" subtitle="Split it, sorted" actions={<IconButton name="search" size={42} label="Search" />} />}>
        <GroupsHome groups={GROUPS} onOpen={noop} onOverall={noop} />
      </Frame>

      <Frame label="→ after tapping “Overall you owe”" note="Owe vs owed, every person's net across all groups, by-group breakdown, share of spend."
        bar={<AppBar title="Overall" subtitle="Every group, every person" onBack={noop} actions={<IconButton name="share-2" size={42} label="Share summary" />} />}>
        <OverallScreen groups={GROUPS} members={MEMBERS} onOpenGroup={noop} onSettle={noop} />
      </Frame>

      <Frame label="→ after tapping “Osaka trip”" note="Balance hero, three-up spend stats, who owes who, filter chips, feed grouped by day."
        bar={<AppBar title="Osaka trip" subtitle="4 people · since 12 Jun" onBack={noop}
          actions={<><IconButton name="user-plus" size={42} label="Invite" /><IconButton name="ellipsis" size={42} label="More" /></>} />}>
        <GroupDetail group={osaka} onSettle={noop} onOpenExpense={noop} />
      </Frame>

      <Frame label="→ after tapping an expense" note="Total vs your position, who fronted it, read-only split with per-person shares, the note."
        bar={<AppBar title="Osaka trip" subtitle="4 people · since 12 Jun" onBack={noop} actions={<IconButton name="ellipsis" size={42} label="More" />} />}>
        <GroupDetail group={osaka} onSettle={noop} onOpenExpense={noop} />
        <ExpenseDetailSheet expense={expense} onClose={noop} onDelete={noop} />
      </Frame>

      <Frame label="Add expense · step 1" note="Tally's own keypad, category chips, one text field."
        bar={<AppBar title="Osaka trip" subtitle="4 people" onBack={noop} />}>
        <GroupDetail group={osaka} onSettle={noop} onOpenExpense={noop} />
        <AddExpenseSheet open group={osaka} onClose={noop} onSave={noop} />
      </Frame>

      <Frame label="Settle up" note="Mark each person paid; all marked flips the group to all-square."
        bar={<AppBar title="Osaka trip" subtitle="4 people" onBack={noop} />}>
        <GroupDetail group={osaka} onSettle={noop} onOpenExpense={noop} />
        <SettleUpSheet open group={osaka} onClose={noop} onDone={noop} />
      </Frame>
    </>
  );
}

// Fit the whole 3x2 grid inside the pane — width AND height — so all six screens
// are reviewable at once without scrolling.
const fit = () => {
  const wrap = document.getElementById('root');
  wrap.style.transform = 'none';
  const w = wrap.scrollWidth, h = wrap.scrollHeight;
  const scale = Math.min(1, (window.innerWidth - 32) / w, (window.innerHeight - 32) / h);
  wrap.style.transform = 'scale(' + scale + ')';
  document.body.style.padding = '16px';
  document.body.style.height = 'auto';
};
const mount = () => {
  if (!window.OverallScreen) return setTimeout(mount, 40);
  ReactDOM.createRoot(document.getElementById('root')).render(<Gallery />);
  setTimeout(fit, 60);
  window.addEventListener('resize', fit);
};
mount();
</script>
</body></html>
