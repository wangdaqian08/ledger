# The Postgres that `application-dev.yaml` points at — for running LedgerApplication from an IDE
# with the `dev` profile active. The checked-in run configurations in `.run/` do exactly that.
#
#   docker compose up -d      start it; data survives restarts in the named volume
#   docker compose down       stop it, keep the data
#   docker compose down -v    stop it and wipe the data — the next boot re-migrates from V1
#
# Same image PostgresTest pins for the suite: a dev database on a different major version would be
# a dev environment for a different application. Tests and `bootTestRun` never touch this — they
# start their own throwaway container, and its @ServiceConnection beats the datasource properties.
services:
  db:
    image: postgres:18-alpine
    container_name: ledger-db
    # Come back with the Docker daemon after a reboot, so "open IntelliJ, press run" stays true.
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      # Loopback only: these credentials are in the repository, so the port must not face the LAN.
      - "127.0.0.1:5432:5432"
    volumes:
      # postgres:18 images declare the volume one level up from the old /var/lib/postgresql/data;
      # mounting the old path would strand the real data in an anonymous volume that vanishes.
      - ledger-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  ledger-db-data:
