# Local development: a Postgres on localhost and MockIdentityProvider, so nothing here needs
# Google credentials or a network. `docker compose up -d` at the repository root starts the
# matching database; the `server (dev)` run configuration in `.run/` boots the app against it.
#
# The Testcontainers tests also run under this profile, and their @ServiceConnection container
# overrides the datasource below — a ConnectionDetails bean beats properties.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ledger
    username: ledger
    password: ledger

ledger:
  invite:
    # Local and test only. There is deliberately no secret in application.yaml, so any other
    # profile must be given one — a shipped default is a signing key that is public the moment
    # the repository is. Step 11 supplies the real one from Secret Manager.
    secret: dev-only-invite-secret-not-for-any-real-deployment

logging:
  level:
    org.flywaydb: info
