spring:
  application:
    name: ledger

  mvc:
    # RFC 7807 problem responses. Without this Spring answers with its legacy error body, which
    # omits the message entirely — so every reason carefully attached to a 400 or 409 ("the exact
    # amounts add up to 9000, but the expense is 10000") was being thrown away, and the client got
    # a bare status it could not explain to anybody. Only reasons we set deliberately are exposed;
    # unexpected exceptions still say nothing.
    problemdetails:
      enabled: true

  # Flyway owns every table in this database. Hibernate is only allowed to check that the entities
  # still match what the migrations built — it must never alter anything.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  session:
    # `never`, because SPRING_SESSION and SPRING_SESSION_ATTRIBUTES are created by V1__init.sql
    # like every other table. Letting Spring Session create them would leave two owners of the
    # schema and a Flyway validation failure the first time it mattered.
    jdbc:
      initialize-schema: never
    timeout: 30d

  servlet:
    # Receipt uploads. The browser downscales before sending (web/src/lib/receipt.ts), so 5 MB is
    # headroom for the odd original that slips through, not a target — and the cap is what makes
    # ReceiptStorage's whole-byte-array handling safe on a small heap.
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  tomcat:
    # Above max-request-size on purpose: Tomcat has to be willing to swallow an oversized upload
    # for the 413 (ApiExceptionHandler) to travel back. At the default 2 MB it slams the
    # connection mid-upload and the client sees a network error instead of an answer.
    max-swallow-size: 10MB
  servlet:
    session:
      cookie:
        name: LEDGER_SESSION
        http-only: true
        # Lax, not Strict: the share link in the claim flow is a cross-site top-level navigation,
        # and Strict would drop the session on arrival and bounce a signed-in friend to sign-in.
        # No `path`, deliberately: it follows the servlet context — `/` in dev, and the sub-path
        # when production mounts the app under one, keeping the cookie off the host's other app.
        same-site: lax

---
spring:
  config:
    activate:
      on-profile: prod

server:
  # Behind nginx, which terminates TLS on the same box. NATIVE (Tomcat's RemoteIpValve) trusts
  # X-Forwarded-* only from loopback; FRAMEWORK's filter would also honour a client-spoofable
  # `Forwarded:` header, which nginx passes through untouched.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
    threads:
      # The production box is 1 GB shared with another JVM; 200 idle threads is pure stack cost.
      max: 25
  shutdown: graceful
  compression:
    enabled: true
  servlet:
    session:
      cookie:
        # Only outside dev, where localhost is plain http. Set here rather than left to step 11 so
        # that deploying cannot accidentally ship a session cookie that travels in the clear.
        secure: true
